<style>/* Layout: sticky scoreboard header, one scrolling column, bottom court-line nav. */
:root {
  --bg: #edf1ef; --surf: #ffffff; --surf2: #e4eae7; --ink: #0f1c19; --mute: #55645f; --line: #d2dad6;
  --acc: #1b5fb3; --acc-ink: #ffffff; --hot: #dc4f26; --good: #14805a; --warn: #b07808; --bad: #bf3a2f; --star: #cf9300;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif; --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171c; --surf: #15232a; --surf2: #1d2f38; --ink: #e5eeeb; --mute: #8fa39d; --line: #263a44;
    --acc: #5ba7f2; --acc-ink: #07131c; --hot: #ff7d52; --good: #3fcf93; --warn: #e5b23f; --bad: #ff6b5e; --star: #f2b82e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171c; --surf: #15232a; --surf2: #1d2f38; --ink: #e5eeeb; --mute: #8fa39d; --line: #263a44;
  --acc: #5ba7f2; --acc-ink: #07131c; --hot: #ff7d52; --good: #3fcf93; --warn: #e5b23f; --bad: #ff6b5e; --star: #f2b82e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; margin: 0; padding-inline: 0; }
button { font: inherit; color: inherit; }
.wrap { max-width: 780px; margin-inline: auto; padding-inline: 16px; }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surf); border-bottom: 1px solid var(--line); }
.hdr .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.hdr .tm { min-width: 0; flex: 1; }
.hdr h1 { font: 700 22px/1 var(--f-disp); letter-spacing: .02em; text-transform: uppercase; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .sub { font-size: 12.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surf); border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; line-height: 1.1; }
.btn:hover { border-color: var(--acc); }
.btn:focus-visible, .nav button:focus-visible, .row:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.btn.hot { background: var(--hot); border-color: var(--hot); color: #fff; }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.go { font: 700 17px/1 var(--f-disp); letter-spacing: .05em; text-transform: uppercase; padding: 10px 14px; white-space: nowrap; }
main { padding-block: 14px 96px; display: grid; gap: 14px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surf); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding-inline: 8px; }
.nav button { background: none; border: 0; padding: 10px 2px 9px; font: 600 12px/1 var(--f-disp); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); cursor: pointer; border-top: 3px solid transparent; }
.nav button.on { color: var(--acc); border-top-color: var(--acc); }
.nav .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--hot); margin-left: 4px; vertical-align: 2px; }
.card { background: var(--surf); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.card h2, .h2 { font: 700 20px/1.1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.h2 small, .card h2 small { font: 500 13px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--mute); }
.lbl { font: 600 12px/1 var(--f-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.big { font: 700 34px/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: grid; gap: 10px; min-width: 0; }
.rowflex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp { flex: 1; }
.mute { color: var(--mute); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .hot { color: var(--hot); }
.num { font-variant-numeric: tabular-nums; }
.stars { color: var(--star); letter-spacing: 1px; font-size: 14px; white-space: nowrap; }
.stars i { color: var(--line); font-style: normal; }
.list { display: grid; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.list > .row:first-child { border-top: 0; }
.row:hover { background: var(--surf2); }
.row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ds { font-size: 12.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ovr { font: 700 20px/1 var(--f-disp); font-variant-numeric: tabular-nums; min-width: 38px; text-align: center; padding: 6px 4px; border-radius: 5px; background: var(--surf2); }
.ovr.e { background: var(--good); color: #fff; } .ovr.a { background: var(--acc); color: var(--acc-ink); } .ovr.b { background: var(--surf2); } .ovr.c { background: var(--surf2); color: var(--mute); }
.pos { font: 700 12px/1 var(--f-disp); letter-spacing: .06em; background: var(--ink); color: var(--bg); padding: 3px 5px; border-radius: 3px; display: inline-block; min-width: 30px; text-align: center; }
.chip { display: inline-block; font: 600 11.5px/1 var(--f-body); padding: 3px 7px; border-radius: 10px; background: var(--surf2); color: var(--ink); white-space: nowrap; }
.chip.g { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.chip.r { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.chip.y { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.chip.b { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
.meter { height: 8px; background: var(--surf2); border-radius: 4px; overflow: hidden; position: relative; }
.meter > b { display: block; height: 100%; background: var(--acc); border-radius: 4px; }
.meter.g > b { background: var(--good); } .meter.h > b { background: var(--hot); } .meter.w > b { background: var(--warn); }
.meter .mk { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 13px; }
.bar span:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs2 { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tabs2 button { white-space: nowrap; border: 1px solid var(--line); background: var(--surf); border-radius: 16px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.tabs2 button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select, input[type=text], input[type=search], input[type=number] { font: inherit; background: var(--surf); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; max-width: 100%; }
input[type=range] { width: 100%; accent-color: var(--acc); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th { font: 600 11.5px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 6px; border-top: 1px solid var(--line); }
.tbl .r, .tbl th.r { text-align: right; }
.tbl tr.me td { background: color-mix(in srgb, var(--acc) 12%, transparent); font-weight: 600; }
.scroll { overflow-x: auto; }
.sheetbg { position: fixed; inset: 0; background: rgba(5, 12, 10, .55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 780px; max-height: 92%; overflow-y: auto; border-radius: 12px 12px 0 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; align-content: start; }
.sheet .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; z-index: 60; max-width: 92%; font-weight: 500; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
.news { display: grid; gap: 0; }
.news div { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.news div:first-child { border-top: 0; }
.news small { color: var(--mute); margin-right: 6px; font-weight: 600; }
.score { font: 700 26px/1 var(--f-disp); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.court { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--surf); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 4px; min-width: 0; }
.slot select { width: 100%; font-size: 13px; padding: 6px; }
.pip { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: var(--surf2); margin-right: 3px; }
.pip.on { background: var(--acc); }
.pip.bld { background: var(--warn); }
.hero { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.hero .lbl { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.start h1 { font: 700 44px/.95 var(--f-disp); text-transform: uppercase; letter-spacing: .02em; margin: 6px 0 8px; }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surf); text-align: left; width: 100%; cursor: pointer; }
.pick.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.stylecard { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surf); cursor: pointer; display: grid; gap: 4px; }
.stylecard.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.note { font-size: 13px; color: var(--mute); }
hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
@media (prefers-reduced-motion: no-preference) { .meter > b { transition: width .25s; } }

.sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -1px; margin-right: 2px; box-shadow: 0 0 0 1px var(--line); flex: none; }
.stripe { height: 4px; width: 100%; }
textarea { font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surf); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; max-width: 100%; resize: vertical; word-break: break-all; }
details summary { padding: 4px 0; }
.hdr .btn { padding: 8px 10px; }

.newsrow { text-align: left; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 2px; cursor: pointer; }
div.newsrow { cursor: default; }
.news .newsrow:first-child { border-top: 0; }
.newsrow > div { margin-top: 3px; font-size: 14px; }
</style>

/* ====== LOCK IN ====== */

/* ====== NEWS, RUMORS, AWARDS ====== */

/* ---- the weekly news cycle ---- */

/* ---- rumors: each one carries a credibility rating that says how often that kind of source is right ---- */

/* ---- season-end awards and the coaching carousel ---- */

/* ====== COACHING CAROUSEL ====== */
const CAR_LAST = 26;
function carOf() { return S.car || (S.car = { yr: S.year, open: [], pool: [], log: [], apps: [], offers: [], past: [] }); }
const hcFit = () => S.coach.rep * .55 + cOvr(S.coach) * .45;
const jobReach = tid => hcFit() - (S.teams[tid].prestige * .85 + 10);
function carLog(k, txt, tid, extra) { const C = carOf(); C.log.unshift(Object.assign({ y: S.year, w: S.week, k, t: txt, tid }, extra || {})); newsAdd(txt, 'coach', tid != null ? { tid } : undefined); }
function carOpen(t, why, oldName) {

/* called when the season ends: fire / retire / lose coaches, opening vacancies */

  }

}
function carCandidates(v) {

  const pool = S.teams.filter(x => x.id !== v.tid && x.id !== S.tid && !x.vac && x.prestige < t.prestige + 2 && x.prestige > t.prestige - 30);

/* ====== SEASON LOOP, FINANCE, STAFF, FACILITIES ====== */
const absWk = () => S.year * 52 + S.week;
const userTeam = () => S.teams[S.tid];
const staffList = t => STAFF_SLOTS.map(sl => ({ sl, c: t.staff[sl.k] }));

const capOf = t => 800 + t.fac.arena * 500;
function gateFor(t) {
  const rate = clamp(.28 + t.prestige * .004 + winPct(t) * .2 + (rankOf(t.id) <= 25 ? .08 : 0), .2, .98);
  const att = Math.round(capOf(t) * rate), price = 9 + t.prestige * .12;
  return { att, price, rev: Math.round(att * price) };
}
function finProj(t) {
  const inc = {
    'Athletic department allocation': 400000 + t.prestige * 18000,
    'Booster donations': 120000 + t.prestige * 3200 + (S.user.fundAmt || 0) * 1.5,
    'Conference distribution': 90000 + avg(S.teams.filter(x => x.conf === t.conf).map(x => x.prestige)) * 1200,
    'Ticket sales (est. 14 home matches)': gateFor(t).rev * 14
  };
  const sch = t.roster.map(i => S.P[i]).filter(p => p.sch).length;
  const exp = {
    'Scholarships': sch * 34000,
    'Coaching staff': staffSalaries(t) + t.staff.hc.sal,
    'Travel': 120000 + t.prestige * 600,
    'Operations and marketing': 90000 + t.fac.arena * 8000 + 50000,
    'Recruiting budget': 70000,
    'Facility upkeep': FACK.reduce((s, k) => s + t.fac[k], 0) * 5500,

}
function weeklyCash() {
  const t = userTeam(), f = finProj(t), gateFree = f.inc['Ticket sales (est. 14 home matches)'];
  t.cash += (f.ti - gateFree - f.te) / 52;
}

/* ---- facilities ---- */
const buildDur = L => 8 + L * 2;
function startBuild(k) {
  const t = userTeam(), L = t.fac[k], cost = facCost(L);

}

/* ---- staff ---- */

/* ---- player management ---- */

/* ---- weekly upkeep ---- */
function upkeep() {
  const inSeason = S.week <= 21;
  for (const t of S.teams) {
    const ag = teamAgg(t), lu = new Set(getLineup(t).filter(Boolean).map(p => p.id));
    const rate = (.06 + ag.dev / 1000 + t.fac.gym * .006) * (S.week <= 14 ? 1 : .5);
    const mt = 52 + t.fac.lounge * 3 + winPct(t) * 12;
    for (const id of t.roster) {
      const p = S.P[id];
      if (p.inj > 0) { p.inj--; if (t.fac.weight >= 7 && rf() < .25 && p.inj > 0) p.inj--; }
      if (p.pot > p.ovr || rf() < .3) { p.tp = (p.tp || 0) + rate; if (p.tp >= 1) { p.tp -= 1; const k = t.train; if (p.a[k] < 99) { p.a[k]++; recalc(p); } } }
      p.morale = clamp(p.morale + (mt - p.morale) * .04 + (inSeason ? (lu.has(id) ? .3 : -.5) : 0) + (p.sch ? .1 : -.1) + gauss() * .8, 0, 100);
      p.gpa = clamp(p.gpa + (t.fac.academic * .004 - .02 + gauss() * .03), 1.4, 4);
      p.out = p.gpa < 2.0;

  }
  checkBuilds(); weeklyCash();
  recWeekTick(); aiRecruitWeek(); recruitDecisions(); refreshNeeds();
}

      const pt = p.rs ? .65 : clamp(p.gp / 24, 0, 1), before = p.ovr, wasRS = !!p.rs;
      archiveSeason(p, t); growPlayer(p, dev, pt); if (wasRS) { p.rs = false; p.rsUsed = true; if (t.id === S.tid) sum.ev.push(p.name + ' used her redshirt year and keeps her ' + YR[p.yr] + ' standing (now ' + p.ovr + ' ovr).'); } else p.yr++; p.gp = 0; p.sp = 0; p.st_ = {}; p.inj = Math.max(0, p.inj - 6); p.tp = 0;

    if (rf() < (c.yrs <= 1 ? .22 : .05)) { U.staff[sl.k] = null; newsAdd(c.name + ' accepted a head coaching job elsewhere.'); sum.ev.push(c.name + ' left to become a head coach. ' + sl.n + ' is vacant.'); }

}

/* ---- season end ---- */
function endSeason(sum) {
  const T = S.tourney, won = {};
  T.rounds.forEach(rd => rd.forEach(m => { if (m.done) { const w = m.res.hs > m.res.as ? m.h : m.a; won[w] = (won[w] || 0) + 1; } }));

    t.prestige = clamp(t.prestige + clamp((winPct(t) - .5) * 3 + (inF ? 1 : 0) + rw * .8 + (T.champ === t.id ? 3 : 0) - (t.prestige - 60) * .02, -3, 4), 30, 99);

  if (L.inF && L.rw >= 2) { const k = pick(['rec', 'dev', 'tac', 'cond']); S.coach[k] = Math.min(95, S.coach[k] + 1); sum.ev.push('Your ' + k.toUpperCase() + ' rating improved by 1.'); }
  S.coach.rep = clamp(S.coach.rep + (L.w - ex) * .6 + (L.inF ? 3 : -2) + L.rw * 2, 10, 99);

  sum.ev.push('Athletic Director confidence: ' + Math.round(U.ad) + '/100 (' + (d >= 0 ? '+' : '') + Math.round(d) + ').');

    let offers = carJobsForFired();
    if (offers.length < 3) offers = offers.concat(shuffle(S.teams.filter(t => t.id !== S.tid && !offers.includes(t.id) && t.prestige < Math.max(52, U.prestige - 8))).slice(0, 4 - offers.length).map(t => t.id));

  }
}

/* ---- calendar ---- */

  for (const t of S.teams) { t.rec = { w: 0, l: 0, cw: 0, cl: 0 }; for (const id of t.roster) { S.P[id].inj = 0; S.P[id].out = false; } }

    }
    if (w === 14) { const tb = confTable(U.conf), pos = tb.findIndex(t => t.id === S.tid) + 1; sum.ev.push('Regular season complete. You finished #' + pos + ' in the ' + CONFS[U.conf].n + ' at ' + U.rec.w + '-' + U.rec.l + '.'); }
  } else if (w === 15) {

  const hh = S.coach.hist || []; if (hh.length) h += '<div class="card stack"><h2>Your moves</h2>' + hh.map(x => '<div class="note">' + x.y + ': ' + esc(x.from) + ' to ' + esc(x.to) + (x.fired ? ' (after dismissal)' : '') + '</div>').join('') + '</div>';

}
